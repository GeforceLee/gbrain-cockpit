name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub's release-asset CDN failed from runners today while git
      # clones kept working — pinned direct download with curl retries, and
      # an npm-registry fallback (a different CDN entirely) so a broken
      # asset path can never red the pipeline.
      - name: Install bun 1.4.4 (pinned; asset download with npm fallback)
        run: |
          if curl -fsSL -o /tmp/bun.zip --retry 3 --retry-delay 5 --retry-all-errors \
               https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip; then
            echo "installed from the GitHub release asset"
            unzip -oq /tmp/bun.zip -d /tmp/buninst
            install -m 755 /tmp/buninst/bun-linux-x64/bun /usr/local/bin/bun
          else
            echo "asset download failed — falling back to the npm registry"
            npm i -g bun@1.4.4
          fi
          bun --version

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Locale key parity (zh-CN / en)
        run: bun run check:locales

      # The release builds web for the first time otherwise — vite/rollup-level
      # failures (bad asset imports, CSS resolution) belong in CI, not in a tag.
      - name: Build web bundle
        run: bun run build

      - name: Supply-chain audit
        run: bun audit --prod

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
