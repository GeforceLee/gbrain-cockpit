name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-bun's download flaked across runners today (same commit: one
      # runner green, one red at this very step) — install the pinned bun
      # straight from its GitHub release asset with curl's own retries.
      - name: Install bun 1.4.4 (pinned, retried download)
        run: |
          curl -fsSL -o /tmp/bun.zip --retry 5 --retry-delay 5 --retry-all-errors \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip
          unzip -oq /tmp/bun.zip -d /tmp/buninst
          install -m 755 /tmp/buninst/bun-linux-x64/bun /usr/local/bin/bun
          bun --version

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Locale key parity (zh-CN / en)
        run: bun run check:locales

      # The release builds web for the first time otherwise — vite/rollup-level
      # failures (bad asset imports, CSS resolution) belong in CI, not in a tag.
      - name: Build web bundle
        run: bun run build

      - name: Supply-chain audit
        run: bun audit --prod

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
