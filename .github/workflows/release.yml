name: Release

# Tag-driven release pipeline (AGENTS.md: "CI gates every push; releases build
# from tags"). Pushing v0.x.y builds the web bundle, compiles the server for
# darwin-arm64 + linux-x64, and publishes a GitHub Release with the artifacts.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Same gates as CI — a tag that fails them must not ship.
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Locale key parity (zh-CN / en)
        run: bun run check:locales

      - name: Build web bundle
        run: bun run build

      - name: Compile linux binary
        run: bun run compile:linux

      - name: Upload release artifacts (linux)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-bin/cockpit-linux-x64
            server/deploy/cockpit.service

  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Compile darwin binary
        run: bun run compile:darwin

      - name: Upload release artifacts (darwin)
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/cockpit-darwin-arm64
