name: Release

# Tag-driven release pipeline (AGENTS.md: "CI gates every push; releases build
# from tags"). Pushing v0.x.y builds the web bundle, compiles the server for
# darwin-arm64 + linux-x64, and publishes a GitHub Release with the artifacts.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-bun flaked across runners today — pinned direct download with
      # curl retries instead (same rationale as ci.yml)
      - name: Install bun 1.4.4 (pinned, retried download)
        run: |
          curl -fsSL -o /tmp/bun.zip --retry 5 --retry-delay 5 --retry-all-errors \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip
          unzip -oq /tmp/bun.zip -d /tmp/buninst
          install -m 755 /tmp/buninst/bun-linux-x64/bun /usr/local/bin/bun
          bun --version

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Same gates as CI — a tag that fails them must not ship.
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Locale key parity (zh-CN / en)
        run: bun run check:locales

      - name: Build web bundle
        run: bun run build

      # The compiled binary serves static files from a dist directory next to
      # itself (server/src/index.ts resolves ../web/dist before $bunfs) — a
      # release without the web bundle ships a UI-less half product, so the
      # bundle itself is an artifact, and the smoke below proves it's there.
      - name: Bundle web-dist for release
        run: tar -czf dist-bin/web-dist.tar.gz -C web dist

      - name: Compile linux binary
        run: bun run compile:linux

      - name: Smoke — binary serves the fresh web bundle
        run: |
          COCKPIT_TOKEN=ci-smoke-token GBRAIN_MCP_TOKEN=ci-unreachable \
            COCKPIT_BIND=127.0.0.1 COCKPIT_PORT=8788 \
            COCKPIT_DIST_DIR="$PWD/web/dist" ./dist-bin/cockpit-linux-x64 &
          # assert only what this artifact exists to prove: the binary serves
          # the just-built bundle. No brain is reachable in CI — healthz would
          # probe dead upstreams, which is not this smoke's question.
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8788/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "static root answered $code"; exit 1; }
          curl -fsS http://127.0.0.1:8788/ | grep -q "<title>gbrain-cockpit" && echo "web bundle served ✓"
          kill %1

      - name: Upload release artifacts (linux)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-bin/cockpit-linux-x64
            dist-bin/web-dist.tar.gz
            server/deploy/cockpit.service

  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # setup-bun flake workaround, macOS flavor (see the linux job above)
      - name: Install bun 1.4.4 (pinned, retried download)
        run: |
          curl -fsSL -o /tmp/bun.zip --retry 5 --retry-delay 5 --retry-all-errors \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-darwin-aarch64.zip
          unzip -oq /tmp/bun.zip -d /tmp/buninst
          sudo install -m 755 /tmp/buninst/bun-darwin-aarch64/bun /usr/local/bin/bun
          bun --version

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Compile darwin binary
        run: bun run compile:darwin

      - name: Upload release artifacts (darwin)
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/cockpit-darwin-arm64
